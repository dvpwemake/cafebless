<style>
#gate{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(13,10,9,.88);font-family:"Segoe UI",Helvetica,Arial,sans-serif}
#gate.on{display:flex}
#gate form{width:100%;max-width:360px;background:#18120f;color:#f8f2ec;border:1px solid #5a4850;border-radius:12px;padding:28px}
#gate h2{font-size:20px;margin:0 0 6px}#gate p{margin:0 0 18px;color:#dccfc6;font-size:14px}
#gate input,#gate button{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid #5a4850}
#gate input{background:#0d0a09;color:#f8f2ec;margin-bottom:12px}
#gate button{background:#d9a88c;color:#18120f;border:0;font-weight:600;cursor:pointer}
#gate button[disabled]{opacity:.6;cursor:wait}#gate .x{background:none;color:#dccfc6;border:0;margin-top:8px;font-weight:400}
#gerr{color:#f0a0a0;font-size:14px;min-height:20px;margin:10px 0 0}
</style>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gh"><form id="gf" autocomplete="off">
<h2 id="gh">Enter the password to continue</h2><p>The rest of this presentation is private.</p>
<input id="gpw" type="password" inputmode="numeric" placeholder="Password" aria-label="Password">
<button id="ggo" type="submit">Continue</button><button id="gx" type="button" class="x">Back to first slide</button><div id="gerr" role="alert"></div></form></div>
<script>__AESJS__</script>
<script>
(function(){
// Works on plain http:// and https://: no WebCrypto. Key = SHA-256 repeated __ITER__ times over (salt, password); AES-256-CTR; the plaintext starts with a 16-byte marker that proves the password.
var D={salt:"__SALT__",iv:"__IV__",iter:__ITER__,url:"__DATAURL__"},MAGIC="CAFEBLESS-DECK-1";
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function frac(x){return Math.floor((x-Math.floor(x))*4294967296)>>>0}
var P=[],K=new Uint32Array(64),H0=new Uint32Array(8);
(function(){for(var n=2;P.length<64;n++){var p=true;for(var d=2;d*d<=n;d++)if(n%d===0){p=false;break}if(p)P.push(n)}
for(var i=0;i<64;i++)K[i]=frac(Math.cbrt(P[i]));for(i=0;i<8;i++)H0[i]=frac(Math.sqrt(P[i]))})();
var W=new Uint32Array(64);
function sha256(m){
  var l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=128;
  var dv=new DataView(b.buffer);dv.setUint32(n-8,Math.floor(l/536870912));dv.setUint32(n-4,(l<<3)>>>0);
  var h=new Uint32Array(H0),i,a,c;
  for(var o=0;o<n;o+=64){
    for(i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);
    for(i=16;i<64;i++){a=W[i-15];c=W[i-2];W[i]=(W[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+W[i-7]+(((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10)))|0}
    var A=h[0],B=h[1],C=h[2],E=h[3],F=h[4],G=h[5],I=h[6],J=h[7],t1,t2;
    for(i=0;i<64;i++){
      t1=(J+(((F>>>6)|(F<<26))^((F>>>11)|(F<<21))^((F>>>25)|(F<<7)))+((F&G)^(~F&I))+K[i]+W[i])|0;
      t2=((((A>>>2)|(A<<30))^((A>>>13)|(A<<19))^((A>>>22)|(A<<10)))+((A&B)^(A&C)^(B&C)))|0;
      J=I;I=G;G=F;F=(E+t1)|0;E=C;C=B;B=A;A=(t1+t2)|0}
    h[0]+=A;h[1]+=B;h[2]+=C;h[3]+=E;h[4]+=F;h[5]+=G;h[6]+=I;h[7]+=J}
  var out=new Uint8Array(32),od=new DataView(out.buffer);for(i=0;i<8;i++)od.setUint32(i*4,h[i]);return out}
function cat(){var n=0,i;for(i=0;i<arguments.length;i++)n+=arguments[i].length;var r=new Uint8Array(n),o=0;for(i=0;i<arguments.length;i++){r.set(arguments[i],o);o+=arguments[i].length}return r}
function bad(){var e=new Error("bad password");e.name="BadPassword";return e}
function okMagic(pt){for(var i=0;i<16;i++)if(pt[i]!==MAGIC.charCodeAt(i))return false;return true}
function counter(){var c=new aesjs.Counter(0);c.setBytes(u8(D.iv));return c}
function derive(pw){
  var p=new TextEncoder().encode(pw),salt=u8(D.salt),k=sha256(cat(salt,p));
  for(var i=0;i<D.iter;i++)k=sha256(cat(k,p,salt));
  return k}
// Fast path (https, localhost): the browser's own AES. Slow path (plain http): aes-js, so the password is checked on the first 16 bytes before decrypting the rest.
// The encrypted deck (about 4 MB) is NOT in this page: link-preview engines (Apple Messages) abort on a page that large.
// It is fetched here, only after a password is typed.
var enc=null;
async function loadData(){
  if(enc)return enc;
  var r;try{r=await fetch(D.url)}catch(x){var e=new Error("network");e.name="LoadError";throw e}
  if(!r.ok){var e2=new Error("http "+r.status);e2.name="LoadError";throw e2}
  enc=u8(await r.text());return enc}
async function dec(pw){
  var k=derive(pw),data=await loadData(),pt;
  if(window.crypto&&crypto.subtle){
    var key=await crypto.subtle.importKey("raw",k,"AES-CTR",false,["decrypt"]);
    pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-CTR",counter:u8(D.iv),length:128},key,data));
    if(!okMagic(pt))throw bad()}
  else{
    if(!okMagic(new aesjs.ModeOfOperation.ctr(k,counter()).decrypt(data.subarray(0,16))))throw bad();
    pt=new aesjs.ModeOfOperation.ctr(k,counter()).decrypt(data)}
  return new TextDecoder().decode(pt.subarray(16))}
function later(f){return new Promise(function(r,j){setTimeout(function(){try{Promise.resolve(f()).then(r,j)}catch(e){j(e)}},30)})}
function show(html){document.open();document.write(html);document.close()}
var ov=document.getElementById("gate"),f=document.getElementById("gf"),pw=document.getElementById("gpw"),btn=document.getElementById("ggo"),err=document.getElementById("gerr");
function ask(){ov.classList.add("on");err.textContent="";setTimeout(function(){pw.focus()},0)}
function why(x){return x&&x.name==="BadPassword"?"Wrong password.":x&&x.name==="LoadError"?"Could not load the presentation. Check your connection and try again.":"Could not open the presentation ("+(x&&x.name||"error")+")."}
// Going past slide 1 asks for the password; going back is handled by the deck itself.
var orig=window.go;window.go=function(n){if(n>0)ask();else orig(n)};
["keydown","touchend","touchstart"].forEach(function(t){ov.addEventListener(t,function(e){e.stopPropagation()},t==="touchend"?{passive:true}:false)});
ov.addEventListener("keydown",function(e){if(e.key==="Escape")ov.classList.remove("on")});
document.getElementById("gx").onclick=function(){ov.classList.remove("on")};
f.addEventListener("submit",function(e){
  e.preventDefault();btn.disabled=true;btn.textContent="Opening…";err.textContent="";var v=pw.value;
  later(function(){return dec(v)}).then(function(html){try{sessionStorage.setItem("pw",v)}catch(_){}location.hash="2";show(html)},
    function(x){err.textContent=why(x);btn.disabled=false;btn.textContent="Continue";pw.select()})});
// A visitor who already entered the password this session goes straight in.
try{var saved=sessionStorage.getItem("pw");if(saved)later(function(){return dec(saved)}).then(function(h){var n=location.hash;show(h);if(n)location.hash=n},function(){})}catch(_){}
})();
</script>
